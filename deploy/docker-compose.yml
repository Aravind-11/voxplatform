# Production stack on one GPU host:  vLLM (Ultravox) + 2 API nodes + Postgres + Redis + Caddy (TLS, load balancer)
#                                    + Prometheus + Alertmanager + Grafana.
#   bash deploy/up.sh          # creates secrets, starts everything, prints your keys. See README section 5.
# Needs the NVIDIA container toolkit and a domain pointing at this host. Written from the verified bare-metal setup;
# the configs it mounts are validated (promtool, amtool, caddy) and the same topology was run as processes
# (tests/e2e/ha_test.sh); the container images themselves have NOT been built or started in this repo's build
# environment (its image registries are blocked). Check `docker compose logs vllm` first: the model download is ~70 GB.
#
# More capacity: add GPU hosts, run the same api service on each, and list every node in VOX_UPSTREAMS (Caddyfile).
name: voxplatform

x-api: &api
  build: { context: .., dockerfile: deploy/Dockerfile.api }
  # One process per container. Horizontal scale is more api containers, not workers inside one
  # container, because a WebSocket must stay on the process that accepted it. VOX_PROCS is NOT
  # used to set uvicorn workers > 1 inside one container (it only drives scripts/deploy.sh).
  command: ["uvicorn", "api.main:app", "--host", "0.0.0.0", "--port", "8080", "--workers", "1", "--proxy-headers"]
  depends_on: { vllm: { condition: service_healthy }, postgres: { condition: service_healthy }, redis: { condition: service_started } }
  environment: &api-env
    VOX_VLLM_URL: http://vllm:8000/v1
    VOX_DB: postgresql://vox:${POSTGRES_PASSWORD}@postgres/vox
    VOX_REDIS_URL: redis://redis:6379/0
    VOX_PUBLIC_URL: https://${VOX_DOMAIN}
    VOX_ADMIN_KEY: ${VOX_ADMIN_KEY}
    VOX_METRICS_TOKEN: ${VOX_METRICS_TOKEN}
    TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
    TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
    VOX_TWILIO_NUMBER: ${VOX_TWILIO_NUMBER:-}
    VOX_RECORD_DIR: /data/recordings
    VOX_DEFAULT_CONCURRENCY: ${VOX_DEFAULT_CONCURRENCY:-64}
    VOX_PROCS: "1"                                         # not a worker count; see the command comment above
    VOX_EOT: model
    VOX_EOT_THRESHOLD: "0.9"
    VOX_NO_ESPEAK: ${VOX_NO_ESPEAK:-1}
    VOX_PRELOAD_LANGS: ${VOX_PRELOAD_LANGS:-a}
    HF_HOME: /models/hf
    VOX_AUDIOSOCKET_PORT: ${VOX_AUDIOSOCKET_PORT:-0}          # SIP path (docs/SIP.md): 0 = off
    VOX_AUDIOSOCKET_AGENT: ${VOX_SIP_AGENT:-}
    VOX_AUDIOSOCKET_HOST: 0.0.0.0                              # private compose network only; never publish this port
    VOX_SIP_TOKEN: ${VOX_SIP_TOKEN:-}                          # POST /internal/sip/setup; empty = endpoint off (404)
  volumes: [ "models:/models", "recordings:/data/recordings" ]
  deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: 1, capabilities: [ gpu ] } ] } } }
  stop_grace_period: 1h          # live calls finish after the drain (see deploy/drain.py)
  restart: unless-stopped

services:
  vllm:
    # Pin this to the vLLM version printed by scripts/00_setup.sh on a known-good box.
    image: vllm/vllm-openai:${VLLM_TAG:-latest}
    command: >
      --model fixie-ai/ultravox-v0_6-qwen-3-32b --served-model-name ultravox --trust-remote-code
      --dtype bfloat16 --quantization fp8 --max-model-len 8192 --gpu-memory-utilization 0.60
      --limit-mm-per-prompt '{"audio": 1}' --enable-auto-tool-choice --tool-call-parser hermes
    environment:
      HF_HOME: /models/hf
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    volumes: [ "models:/models" ]
    ipc: host
    deploy: { resources: { reservations: { devices: [ { driver: nvidia, count: 1, capabilities: [ gpu ] } ] } } }
    healthcheck: { test: [ "CMD", "curl", "-fs", "http://localhost:8000/v1/models" ], interval: 20s, timeout: 5s, retries: 60, start_period: 120s }
    restart: unless-stopped

  api1: { <<: *api, hostname: api1 }
  api2: { <<: *api, hostname: api2 }

  asterisk:
    # SIP front end for VoxSun or any SIP provider: `docker compose --profile sip up -d`. Configure deploy/sip/pjsip.conf first.
    profiles: [ sip ]
    build: { context: ., dockerfile: Dockerfile.asterisk }
    hostname: asterisk
    depends_on: [ api1 ]
    environment:
      SIP_SETUP_TOKEN: ${VOX_SIP_TOKEN:-}                      # dialplan reads this; must match the api VOX_SIP_TOKEN. Not a secret in the image.
    ports: [ "5060:5060/udp", "10000-10100:10000-10100/udp" ]
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: vox, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}", POSTGRES_DB: vox }
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    healthcheck: { test: [ "CMD-SHELL", "pg_isready -U vox" ], interval: 5s, timeout: 3s, retries: 20 }
    restart: unless-stopped

  redis:
    image: redis:7
    command: [ "redis-server", "--save", "", "--appendonly", "no" ]    # only call counters live here; losing them is harmless
    restart: unless-stopped

  proxy:
    image: caddy:2
    depends_on: [ api1, api2 ]
    ports: [ "80:80", "443:443" ]
    environment: { VOX_DOMAIN: "${VOX_DOMAIN}", VOX_UPSTREAMS: "${VOX_UPSTREAMS:-api1:8080 api2:8080}" }
    volumes: [ "./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy:/data" ]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command: [ "--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d" ]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./monitoring/targets:/etc/prometheus/targets:ro
      - promdata:/prometheus
    secrets: [ vox_metrics_token ]
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command: [ "--config.file=/etc/alertmanager/alertmanager.yml" ]
    volumes: [ "./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro" ]
    secrets: [ alert_webhook_url ]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment: { GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password, GF_USERS_ALLOW_SIGN_UP: "false" }
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana:/var/lib/grafana
    secrets: [ grafana_admin_password ]
    ports: [ "127.0.0.1:3000:3000" ]        # reach it through an SSH tunnel; do not expose it publicly
    restart: unless-stopped

secrets:
  vox_metrics_token: { file: ./secrets/vox_metrics_token }
  alert_webhook_url: { file: ./secrets/alert_webhook_url }
  grafana_admin_password: { file: ./secrets/grafana_admin_password }

volumes: { models: {}, recordings: {}, pgdata: {}, caddy: {}, promdata: {}, grafana: {} }
