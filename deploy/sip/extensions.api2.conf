; Dialplan for compose service asterisk2 only (mounted over extensions.conf).
; The primary Asterisk keeps extensions.conf, which dials api1.
[from-voxsun]
exten => _X.,1,NoOp(Incoming call from ${CALLERID(num)} to ${EXTEN})
 same => n,Answer()
 same => n,AudioSocket(${UUID()},api2:9092)
 same => n,Hangup()
exten => _+X.,1,Goto(_X.,1)
