; Dialplan for compose service asterisk2 only (mounted over extensions.conf).
; The primary Asterisk keeps extensions.conf, which dials api1. This one dials api2 and posts
; caller id to api2. It does not register the trunk.
[from-voxsun]
exten => _X.,1,NoOp(Incoming call from ${CALLERID(num)} to ${EXTEN})
 same => n,Answer()
 ; end="" keeps a trailing newline out of CALLUUID: AudioSocket and the setup row have to be the same id.
 same => n,Set(CALLUUID=${SHELL(python3 -c 'import uuid\; print(uuid.uuid4(), end="")')})
 ; FILTER keeps digits and '+'. The helper form-encodes '+' as %2B. The token is not interpolated.
 same => n,Set(SIP_CALLER=${FILTER(0-9+,${CALLERID(num)})})
 same => n,Set(SIP_EXTEN=${FILTER(0-9+,${EXTEN})})
 same => n,System(python3 /etc/asterisk/sip_setup.py "${SIP_CALLER}" "${SIP_EXTEN}" "${CALLUUID}" "http://api2:8080/internal/sip/setup")
 ; Same slin16 channel as the primary. ${CALLUUID} matches the setup row posted to api2.
 same => n,Dial(AudioSocket/api2:9092/${CALLUUID}/c(slin16))
 same => n,Hangup()
; Strip a leading '+' so the digits pattern runs with the dialed number still in ${EXTEN}.
exten => _+X.,1,Goto(${EXTEN:1},1)
