; Every call arriving from VoxSun is answered and its audio is streamed to the voice engine over AudioSocket.
; "api1" is the engine's hostname (compose service name); 9092 must equal VOX_AUDIOSOCKET_PORT.
; The dialplan tells the API which number was dialed (POST /internal/sip/setup) before AudioSocket, using the
; same UUID the socket will present. Compose passes VOX_SIP_TOKEN into this container as SIP_SETUP_TOKEN.
; sip_setup.py reads that environment variable itself and posts caller plus the dialed number as both exten
; and callee, so {{caller}} and {{callee}} can be filled. An empty token leaves the endpoint off (404).
; Before the wideband Dial, bind CHANNEL(uniqueid) to that same UUID so a machine hangup deletes the
; channel and not the socket id. The CURL token is ${ENV(VOX_SIP_TOKEN)} (same secret, not interpolated
; into sip_setup.py). Avoid "," "(" ")" in the token: it is expanded into this dialplan.
; func_curl and func_env must load (modules.conf autoload=yes). A failed bind still opens the socket.
; A cold transfer stores the target and hangs up the audio leg, which returns 0 here. The next priority
; reads that target and Dial(PJSIP/number) with no @voxsun, or Hangup() when nothing was stored.
; Do not ARI-redirect: this channel is not in Stasis, and redirect answers 409.
; Outbound SIP is not this context: the API originates via ARI into Stasis app "vox" with appArgs amd,<call id>
; when a voicemail message is set. That app POSTs AnsweredBy to http://api1:8080/sip/amd/<call id>
; and the same bind to http://api1:8080/sip/bind, with header X-Vox-Sip-Token.
[from-voxsun]
exten => _X.,1,NoOp(Incoming call from ${CALLERID(num)} to ${EXTEN})
 same => n,Answer()
 ; Asterisk treats a raw ";" as a comment, so the semicolon inside the python one-liner is written "\;".
 ; end="" keeps a trailing newline out of CALLUUID: the setup row and the socket have to be the same id.
 same => n,Set(CALLUUID=${SHELL(python3 -c 'import uuid\; print(uuid.uuid4(), end="")')})
 ; System() is /bin/sh -c. Double quotes still run $(...) and backticks, and a " ends the quote.
 ; FILTER keeps digits and '+'. The helper form-encodes '+' as %2B. The token is not interpolated.
 same => n,Set(SIP_CALLER=${FILTER(0-9+,${CALLERID(num)})})
 same => n,Set(SIP_EXTEN=${FILTER(0-9+,${EXTEN})})
 same => n,System(python3 /etc/asterisk/sip_setup.py "${SIP_CALLER}" "${SIP_EXTEN}" "${CALLUUID}" "http://api1:8080/internal/sip/setup")
 ; AS_UUID is the id posted above. A second UUID() would miss the setup row and the socket.
 same => n,Set(AS_UUID=${CALLUUID})
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=2)
 same => n,Set(CURLOPT(httpheader)=Content-Type: application/x-www-form-urlencoded)
 same => n,Set(CURLOPT(httpheader)=X-Vox-Sip-Token: ${ENV(VOX_SIP_TOKEN)})
 same => n,Set(VOX_BIND=${CURL(http://api1:8080/sip/bind,uuid=${AS_UUID}&channelId=${CHANNEL(uniqueid)})})
 ; The application form forces 8 kHz. Dial() with c(slin16) is kind 0x12, 640 bytes per 20 ms.
 same => n,Dial(AudioSocket/api1:9092/${CALLUUID}/c(slin16))
 ; CURLOPT from the bind above is still set. Keep only an E.164 body so an error page cannot be dialed.
 same => n,Set(VOX_XFER=${FILTER(+0123456789,${CURL(http://api1:8080/sip/transfer?uuid=${AS_UUID})})})
 same => n,GotoIf($["${VOX_XFER}" = ""]?done)
 same => n,GotoIf($[${LEN(${VOX_XFER})} < 8]?done)
 same => n,Dial(PJSIP/${VOX_XFER})
 same => n(done),Hangup()
; Strip a leading '+' so _X. runs with the dialed digits still in ${EXTEN}.
; A Goto that names the pattern literally never re-matches, so a leading + would not reach Dial.
exten => _+X.,1,Goto(${EXTEN:1},1)
