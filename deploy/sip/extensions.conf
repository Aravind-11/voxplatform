; Every call arriving from VoxSun is answered and its audio is streamed to the voice engine over AudioSocket.
; "api1" is the engine's hostname (compose service name); 9092 must equal VOX_AUDIOSOCKET_PORT.
[from-voxsun]
exten => _X.,1,NoOp(Incoming call from ${CALLERID(num)} to ${EXTEN})
 same => n,Answer()
 ; AudioSocket() forces 8 kHz slin and ignores CHANNEL(audioreadformat). The channel driver
 ; selects the codec: slin16 is kind 0x12, 640 bytes per 20 ms, on a current Asterisk.
 same => n,Dial(AudioSocket/api1:9092/${UUID()}/c(slin16))
 same => n,Hangup()
; Goto(_X.,1) looks up an extension named "_X." and never re-matches, so +E.164 never reaches Dial.
exten => _+X.,1,Goto(${EXTEN:1},1)
