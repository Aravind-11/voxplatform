; Every call arriving from VoxSun is answered and its audio is streamed to the voice engine over AudioSocket.
; "api1" is the engine's hostname (compose service name); 9092 must equal VOX_AUDIOSOCKET_PORT.
; Before AudioSocket, bind CHANNEL(uniqueid) to the AudioSocket UUID so transfer redirects that channel
; and not the UUID. The token is the container env VOX_SIP_TOKEN (same value as the API). Do not put the
; secret in this file. Avoid "," "(" ")" in the token: it is expanded into this dialplan.
; func_curl and func_env must load (modules.conf autoload=yes). A failed bind still opens AudioSocket;
; transfer then returns an error instead of redirecting the UUID.
; Outbound SIP is not this context: the API originates via ARI into Stasis app "vox" with appArgs amd,<call id>
; when a voicemail message is set. That app POSTs AnsweredBy to http://api1:8080/sip/amd/<call id>
; and the same bind to http://api1:8080/sip/bind, with header X-Vox-Sip-Token.
[from-voxsun]
exten => _X.,1,NoOp(Incoming call from ${CALLERID(num)} to ${EXTEN})
 same => n,Answer()
 same => n,Set(AS_UUID=${UUID()})
 same => n,Set(CURLOPT(conntimeout)=2)
 same => n,Set(CURLOPT(httptimeout)=2)
 same => n,Set(CURLOPT(httpheader)=Content-Type: application/x-www-form-urlencoded)
 same => n,Set(CURLOPT(httpheader)=X-Vox-Sip-Token: ${ENV(VOX_SIP_TOKEN)})
 same => n,Set(VOX_BIND=${CURL(http://api1:8080/sip/bind,uuid=${AS_UUID}&channelId=${CHANNEL(uniqueid)})})
 same => n,AudioSocket(${AS_UUID},api1:9092)
 same => n,Hangup()
exten => _+X.,1,Goto(_X.,1)
