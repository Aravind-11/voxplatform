; Every call arriving from VoxSun is answered and its audio is streamed to the voice engine over AudioSocket.
; "api1" is the engine's hostname (compose service name); 9092 must equal VOX_AUDIOSOCKET_PORT.
; Outbound SIP is not this context: the API originates via ARI into Stasis app "vox" with appArgs amd,<call id>
; when a voicemail message is set. That app POSTs AnsweredBy to http://api1:8080/sip/amd/<call id>
; with header X-Vox-Sip-Token (compose passes VOX_SIP_TOKEN; do not put the secret in this file).
[from-voxsun]
exten => _X.,1,NoOp(Incoming call from ${CALLERID(num)} to ${EXTEN})
 same => n,Answer()
 same => n,AudioSocket(${UUID()},api1:9092)
 same => n,Hangup()
exten => _+X.,1,Goto(_X.,1)
