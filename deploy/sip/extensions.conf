; Every call arriving from VoxSun is answered and its audio is streamed to the voice engine over AudioSocket.
; "api1" is the engine's hostname (compose service name); 9092 must equal VOX_AUDIOSOCKET_PORT.
; AudioSocket itself carries only a UUID. Post caller id and the dialed number first so the engine can fill
; {{caller}} and {{callee}}. Compose passes VOX_SIP_TOKEN into this container as SIP_SETUP_TOKEN.
; The placeholder below is not a real secret; an empty token leaves /internal/sip/setup off.
[from-voxsun]
exten => _X.,1,NoOp(Incoming call from ${CALLERID(num)} to ${EXTEN})
 same => n,Answer()
 ; Asterisk treats a raw ";" as a comment, so the semicolon inside the python one-liner is written "\;".
 ; end="" keeps a trailing newline out of CALLUUID: the setup row and AudioSocket must use the same id.
 same => n,Set(CALLUUID=${SHELL(python3 -c 'import uuid\; print(uuid.uuid4(), end="")')})
 same => n,Set(SIP_SETUP_TOKEN=${ENV(SIP_SETUP_TOKEN)})
 ; FILTER runs in the dialplan. System() is /bin/sh, and $() still runs inside double quotes.
 same => n,Set(SAFE_CALLER=${FILTER(0-9+,${CALLERID(num)})})
 same => n,Set(SAFE_CALLEE=${FILTER(0-9+,${EXTEN})})
 same => n,System(curl -s -m 2 -H "X-Vox-Sip-Token: ${SIP_SETUP_TOKEN}" --data-urlencode "uuid=${CALLUUID}" --data-urlencode "caller=${SAFE_CALLER}" --data-urlencode "callee=${SAFE_CALLEE}" http://api1:8080/internal/sip/setup)
 same => n,AudioSocket(${CALLUUID},api1:9092)
 same => n,Hangup()
; Strip a leading '+' so _X. runs with the dialed digits still in ${EXTEN}.
exten => _+X.,1,Goto(${EXTEN:1},1)
