; Every call arriving from VoxSun is answered and its audio is streamed to the voice engine over AudioSocket.
; "api1" is the engine's hostname (compose service name); 9092 must equal VOX_AUDIOSOCKET_PORT.
; The dialplan tells the API which number was dialed (POST /internal/sip/setup) before AudioSocket, using the
; same UUID the socket will present. Compose passes VOX_SIP_TOKEN into this container as SIP_SETUP_TOKEN.
; sip_setup.py reads that environment variable itself and posts caller plus the dialed number as both exten
; and callee, so {{caller}} and {{callee}} can be filled. An empty token leaves the endpoint off (404).
[from-voxsun]
exten => _X.,1,NoOp(Incoming call from ${CALLERID(num)} to ${EXTEN})
 same => n,Answer()
 ; Asterisk treats a raw ";" as a comment, so the semicolon inside the python one-liner is written "\;".
 ; end="" keeps a trailing newline out of CALLUUID: AudioSocket and the setup row have to be the same id.
 same => n,Set(CALLUUID=${SHELL(python3 -c 'import uuid\; print(uuid.uuid4(), end="")')})
 ; System() is /bin/sh -c. Double quotes still run $(...) and backticks, and a " ends the quote.
 ; FILTER keeps digits and '+'. The helper form-encodes '+' as %2B. The token is not interpolated.
 same => n,Set(SIP_CALLER=${FILTER(0-9+,${CALLERID(num)})})
 same => n,Set(SIP_EXTEN=${FILTER(0-9+,${EXTEN})})
 same => n,System(python3 /etc/asterisk/sip_setup.py "${SIP_CALLER}" "${SIP_EXTEN}" "${CALLUUID}" "http://api1:8080/internal/sip/setup")
 same => n,AudioSocket(${CALLUUID},api1:9092)
 same => n,Hangup()
; Strip a leading '+' so _X. runs with the dialed digits still in ${EXTEN}.
exten => _+X.,1,Goto(${EXTEN:1},1)
