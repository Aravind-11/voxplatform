; Every call arriving from VoxSun is answered and its audio is streamed to the voice engine over AudioSocket.
; "api1" is the engine's hostname (compose service name); 9092 must equal VOX_AUDIOSOCKET_PORT.
[from-voxsun]
exten => _X.,1,NoOp(Incoming call from ${CALLERID(num)} to ${EXTEN})
 same => n,Answer()
 ; Wideband path: signed linear 16 kHz both ways, matching allow=g722 and VOX_AUDIOSOCKET_RATE=16000
 ; (20 ms AudioSocket frames are 640 bytes). For an 8 kHz ulaw trunk, remove these two lines and set the rate to 8000.
 same => n,Set(CHANNEL(audioreadformat)=slin16)
 same => n,Set(CHANNEL(audiowriteformat)=slin16)
 same => n,AudioSocket(${UUID()},api1:9092)
 same => n,Hangup()
exten => _+X.,1,Goto(_X.,1)
