#!KAMAILIO
#
# Not run in CI. Syntax aimed at Kamailio 5.
# Stateless SIP proxy: spreads INVITEs across two Asterisk nodes (compose services
# asterisk and asterisk2). One Asterisk is a single point of failure; this file is the
# proxy layout, and carrier-side failover is the other. It is not started by compose.
# AudioSocket needs its own TCP load balancer in front of the API nodes (docs/SIP.md).
# Check only: kamailio -c -f deploy/sip/kamailio.cfg

listen=udp:0.0.0.0:5060

loadmodule "sl.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"

request_route {
    if (!mf_process_maxfwd_header("10")) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    # INVITE and its retransmits: pin the Call-ID local-part to one Asterisk via $du.
    # $ci is local@host. A class anchored at the end of $ci follows the host (".com"), so every
    # such call would land on asterisk2. Match the character before '@' instead.
    if (is_method("INVITE|ACK|BYE|CANCEL")) {
        if ($ci =~ "[02468aceACE]@") {
            $du = "sip:asterisk:5060";
        } else {
            $du = "sip:asterisk2:5060";
        }
        if (!forward()) {
            sl_send_reply("500", "No Asterisk");
        }
        exit;
    }

    if (is_method("OPTIONS")) {
        sl_send_reply("200", "OK");
        exit;
    }
    sl_send_reply("405", "Method Not Allowed");
}
