[modules]
autoload=yes
; Dial(AudioSocket/...) is the channel driver. Without chan_audiosocket.so Asterisk reports
; "No channel type registered for AudioSocket" and the call never reaches the engine.
; app_audiosocket.so is the 8 kHz application and does not carry slin16.
load = chan_audiosocket.so
load = res_audiosocket.so
