; Asterisk SIP trunk to VoxSun (or any SIP provider/PBX). WRITTEN FROM ASTERISK DOCS, NOT YET RUN AGAINST VOXSUN.
; Replace the UPPERCASE values with what VoxSun gives you (SIP server, username, password) -- see docs/SIP.md.
; VoxSun's published docs list G.711, G.722, G.729 and Opus codecs and TLS/SRTP; we use plain G.711 (ulaw/alaw).

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Behind NAT (cloud VM): uncomment and set the PUBLIC address so audio flows both ways.
;external_media_address=YOUR_PUBLIC_IP
;external_signaling_address=YOUR_PUBLIC_IP
;local_net=10.0.0.0/8

; --- Option A: VoxSun gives us a username/password and we register to it ---
[voxsun-reg]
type=registration
outbound_auth=voxsun-auth
server_uri=sip:VOXSUN_SIP_SERVER
client_uri=sip:VOXSUN_USERNAME@VOXSUN_SIP_SERVER
retry_interval=60

[voxsun-auth]
type=auth
auth_type=userpass
username=VOXSUN_USERNAME
password=VOXSUN_PASSWORD

[voxsun-aor]
type=aor
contact=sip:VOXSUN_SIP_SERVER

[voxsun]
type=endpoint
transport=transport-udp
context=from-voxsun
disallow=all
allow=ulaw
allow=alaw
outbound_auth=voxsun-auth
aors=voxsun-aor
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

; --- Option B: VoxSun sends calls from a fixed IP (no registration): keep this, delete the registration/auth blocks ---
[voxsun-ip]
type=identify
endpoint=voxsun
match=VOXSUN_SIP_SERVER_IP
